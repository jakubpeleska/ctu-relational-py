[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "redelex"
# The version is read from redelex/__init__.py (__version__) by flit.
dynamic = ["version"]
description = "ReDeLEx: A Framework for Relational Deep Learning Exploration"
authors = [{ name = "Jakub Peleška", email = "jakub.peleska@fel.cvut.cz" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.12"
keywords = []
dependencies = [
    "pandas>=2.3.3",
    "pymysql>=1.1.2",
    "sqlalchemy>=2.0.46",
    "inflect>=7.5.0",
    "tqdm>=4.67.1",
    "attrs>=25.4.0",
    "relbench>=2.1.1",
]

[project.optional-dependencies]
torch = [
    "torch",
    "torchvision",
    "torchaudio",
    "pytorch-frame",
    "torch-geometric",
    "sentence-transformers",
]


[dependency-groups]

cpu = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "pyg-lib>=0.6.0",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "pytorch-frame>=0.3.0",
    "torch-geometric>=2.7.0",
    "sentence-transformers>=4.0.1",
]
cu124 = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "torchaudio==2.4.1",
    "pyg-lib>=0.4.0",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "pytorch-frame>=0.2.5",
    "torch-geometric>=2.6.1",
    "sentence-transformers>=4.0.1",
]
cu128 = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "pyg-lib>=0.6.0",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "pytorch-frame>=0.3.0",
    "torch-geometric>=2.7.0",
    "sentence-transformers>=4.0.1",
]

dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "pre-commit>=4.5.1",
    "pytest>=8.3",
]
experiments = [
    "lightning>=2.6.0",
    "mlflow==2.22.1",
    "ray[data,serve,train,tune]==2.46.0",
    "getml>=1.5.0",
    "pynvml>=13.0.1",
]
visualization = ["jinja2>=3.1.6", "pydot>=4.0.1"]


[tool.uv]
default-groups = ["dev", "cpu", "experiments", "visualization"]
# Guarantee that the lock file contains wheels usable on Linux x86_64. Without
# this, uv can pick a torch build whose local version sorts highest but only
# ships wheels for another platform (e.g. torchvision "+d801a34" is win_arm64).
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
    [
        { group = "cpu" },
        { group = "cu124" },
        { group = "cu128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "torch-cpu", group = "cpu" },
    { index = "torch-cu124", group = "cu124" },
    { index = "torch-cu128", group = "cu128" },
]
torchvision = [
    { index = "torch-cpu", group = "cpu" },
    { index = "torch-cu124", group = "cu124" },
    { index = "torch-cu128", group = "cu128" },
]
torchaudio = [
    { index = "torch-cpu", group = "cpu" },
    { index = "torch-cu124", group = "cu124" },
    { index = "torch-cu128", group = "cu128" },
]
pyg-lib = [
    { index = "pyg-cpu", group = "cpu" },
    { index = "pyg-cu124", group = "cu124" },
    { index = "pyg-cu128", group = "cu128" },
]
torch-scatter = [
    { index = "pyg-cpu", group = "cpu" },
    { index = "pyg-cu124", group = "cu124" },
    { index = "pyg-cu128", group = "cu128" },
]
torch-sparse = [
    { index = "pyg-cpu", group = "cpu" },
    { index = "pyg-cu124", group = "cu124" },
    { index = "pyg-cu128", group = "cu128" },
]


[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[[tool.uv.index]]
name = "torch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true


[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


# Flat (find-links) indexes of the compiled PyG extensions. The URL encodes the
# torch version of the corresponding dependency group, so it must be updated
# together with the torch pin.
[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.9.1+cpu.html"
format = "flat"
explicit = true


[[tool.uv.index]]
name = "pyg-cu124"
url = "https://data.pyg.org/whl/torch-2.4.1+cu124.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu128"
url = "https://data.pyg.org/whl/torch-2.9.1+cu128.html"
format = "flat"
explicit = true

[project.urls]
Homepage = "https://github.com/jakubpeleska/redelex"
Issues = "https://github.com/jakubpeleska/redelex/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not needs_network and not slow'"
markers = [
    "slow: long-running tests, excluded by default",
    "needs_network: requires internet access (remote CTU database), excluded by default",
]

[tool.ruff]
line-length = 92
target-version = "py312"
extend-exclude = ["experiments", "notebooks", "scripts"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "F",   # pyflakes
    "I",   # isort
    "SIM", # flake8-simplify
]
